<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#040911"/>
      <stop offset="40%" stop-color="#071526"/>
      <stop offset="75%" stop-color="#0F2B48"/>
      <stop offset="100%" stop-color="#1A3B5C"/>
    </linearGradient>

    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141E1C"/>
      <stop offset="40%" stop-color="#0B1011"/>
      <stop offset="100%" stop-color="#030506"/>
    </linearGradient>

    <linearGradient id="orangeButton" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF7500"/>
      <stop offset="100%" stop-color="#FF5500"/>
    </linearGradient>

    <linearGradient id="truckBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#E2E7ED"/>
      <stop offset="85%" stop-color="#8F9CA8"/>
      <stop offset="100%" stop-color="#55606B"/>
    </linearGradient>

    <filter id="orangeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="headlightGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .font-sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .font-display { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-weight: 800; }
  </style>

  <!-- Dark Sky Background -->
  <rect width="1600" height="900" fill="url(#nightSky)"/>

  <!-- Highway Horizon & Terrain -->
  <rect x="0" y="580" width="1600" height="320" fill="url(#groundGrad)"/>
  <!-- Trees / Landscape silhouette on right -->
  <path d="M 900 600 Q 1020 540 1140 590 Q 1260 520 1380 580 Q 1480 540 1600 590 L 1600 680 L 900 680 Z" fill="#0A1211" opacity="0.85"/>

  <!-- Left: Scania Heavy Haul Commercial Truck Artwork -->
  <g id="truckArt" transform="translate(60, 100)">
    <!-- Trailer container silhouette -->
    <rect x="20" y="30" width="190" height="660" rx="6" fill="#151A20" stroke="#252D36" stroke-width="2"/>
    <line x1="50" y1="30" x2="50" y2="690" stroke="#1D242C" stroke-width="2"/>
    <line x1="85" y1="30" x2="85" y2="690" stroke="#1D242C" stroke-width="2"/>
    <line x1="120" y1="30" x2="120" y2="690" stroke="#1D242C" stroke-width="2"/>
    <line x1="155" y1="30" x2="155" y2="690" stroke="#1D242C" stroke-width="2"/>

    <!-- Truck Cabin Structure -->
    <!-- Cabin Roof & Windshield -->
    <path d="M 170 120 L 460 120 L 470 150 L 485 320 L 180 320 Z" fill="#121820"/>
    <!-- Sun Visor -->
    <path d="M 180 140 L 450 140 L 455 170 L 185 170 Z" fill="#242D36"/>
    <!-- Windshield Glass with Reflections -->
    <path d="M 195 180 L 440 180 L 450 310 L 195 310 Z" fill="#1A2533" stroke="#374554" stroke-width="2"/>
    <path d="M 230 185 L 340 185 L 310 305 L 210 305 Z" fill="#2A384A" opacity="0.45"/>
    <text x="245" y="240" class="font-sans" font-size="28" font-weight="800" fill="#3D4D5F" letter-spacing="4" opacity="0.6">COMELLI</text>

    <!-- Truck Main Hood & White Body Panels -->
    <path d="M 180 320 L 480 320 L 490 530 L 460 680 L 180 680 Z" fill="url(#truckBody)"/>
    <!-- Side Door panel line -->
    <path d="M 180 320 L 180 680 L 210 680 L 210 320 Z" fill="#2A323A"/>

    <!-- Grille Bars -->
    <rect x="220" y="340" width="235" height="15" rx="3" fill="#2A323A"/>
    <rect x="220" y="365" width="235" height="15" rx="3" fill="#2A323A"/>
    <rect x="220" y="390" width="235" height="15" rx="3" fill="#2A323A"/>
    <rect x="220" y="415" width="235" height="15" rx="3" fill="#2A323A"/>

    <!-- SCANIA Chrome Logo -->
    <text x="260" y="485" class="font-sans" font-size="34" font-weight="900" fill="#E8EDF2" letter-spacing="6" opacity="0.9">SCANIA</text>
    <rect x="235" y="505" width="205" height="18" rx="2" fill="#1C232B"/>

    <!-- Headlights & Fog Lamps -->
    <g filter="url(#headlightGlow)">
      <path d="M 215 540 L 270 540 L 265 570 L 215 565 Z" fill="#FFFFFF" opacity="0.95"/>
      <path d="M 405 540 L 460 540 L 460 565 L 410 570 Z" fill="#FFFFFF" opacity="0.95"/>
      <circle cx="240" cy="552" r="12" fill="#FFF2B8"/>
      <circle cx="435" cy="552" r="12" fill="#FFF2B8"/>
    </g>

    <!-- Front Bumper -->
    <rect x="200" y="580" width="280" height="90" rx="8" fill="#182029" stroke="#333F4D" stroke-width="2"/>
    <!-- Front Plate -->
    <rect x="300" y="625" width="80" height="26" rx="3" fill="#0C0F13" stroke="#485869" stroke-width="1.5"/>
    <text x="312" y="643" class="font-sans" font-size="11" font-weight="700" fill="#8898AA" letter-spacing="2">PRG-6959</text>

    <!-- Wheels -->
    <circle cx="200" cy="690" r="48" fill="#0B0E12" stroke="#252D36" stroke-width="8"/>
    <circle cx="200" cy="690" r="24" fill="#3A4654"/>
  </g>

  <!-- Top Floating Pill Navbar -->
  <g id="topNav" transform="translate(320, 36)">
    <!-- Pill Backdrop -->
    <rect x="0" y="0" width="960" height="58" rx="29" fill="rgba(11, 19, 30, 0.72)" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1.2"/>
    
    <!-- Logo -->
    <g transform="translate(36, 17)">
      <path d="M 2 16 L 2 6 C 2 3.8 3.8 2 6 2 L 18 2 C 20.2 2 22 3.8 22 6 L 22 16 Z" fill="none" stroke="#FF7500" stroke-width="2"/>
      <circle cx="6" cy="18" r="3" fill="#FF7500"/>
      <circle cx="18" cy="18" r="3" fill="#FF7500"/>
      <path d="M 14 6 L 20 6 L 24 11 L 24 16 L 21 16" fill="none" stroke="#FF7500" stroke-width="2"/>
      <text x="34" y="18" class="font-sans" font-size="18" font-weight="700" fill="#FFFFFF" letter-spacing="-0.2">TransitOps</text>
    </g>

    <!-- Nav Links -->
    <text x="310" y="34" class="font-sans" font-size="14" font-weight="500" fill="#CBD5E1">Platform</text>
    <text x="400" y="34" class="font-sans" font-size="14" font-weight="500" fill="#CBD5E1">Benefits</text>
    <text x="490" y="34" class="font-sans" font-size="14" font-weight="500" fill="#CBD5E1">Partners</text>
    <text x="580" y="34" class="font-sans" font-size="14" font-weight="500" fill="#CBD5E1">Contact</text>

    <!-- Right Side Actions -->
    <text x="790" y="34" class="font-sans" font-size="14" font-weight="600" fill="#FFFFFF">Log in</text>
    <rect x="850" y="10" width="95" height="38" rx="19" fill="#FFFFFF"/>
    <text x="866" y="33" class="font-sans" font-size="13" font-weight="700" fill="#0B131E">Get Started</text>
  </g>

  <!-- Left Value Prop Description -->
  <text x="375" y="270" class="font-sans" font-size="18" font-weight="400" fill="#E2E8F0" opacity="0.9">
    <tspan x="375" dy="0">Track every vehicle, driver, and</tspan>
    <tspan x="375" dy="26">trip in real time — no</tspan>
    <tspan x="375" dy="26">spreadsheets, no blind spots.</tspan>
  </text>

  <!-- Massive Headline Typography -->
  <!-- Layer 1: Semi-transparent Cyan Silhouette Text "your fleet" behind -->
  <text x="590" y="520" class="font-display" font-size="138" font-weight="900" fill="#38BDF8" opacity="0.28" letter-spacing="-2">your fleet</text>

  <!-- Layer 2: Dominant Foreground Solid White Headlines -->
  <text x="455" y="445" class="font-display" font-size="138" font-weight="900" fill="#FFFFFF" letter-spacing="-3">move</text>
  <text x="455" y="660" class="font-display" font-size="138" font-weight="900" fill="#FFFFFF" letter-spacing="-3">forward</text>

  <!-- KPI Metric 1: Fleets Managed (Top Right) -->
  <g transform="translate(980, 290)">
    <line x1="-30" y1="20" x2="-10" y2="0" stroke="#38BDF8" stroke-width="1.5" opacity="0.5"/>
    <line x1="-10" y1="0" x2="30" y2="0" stroke="#38BDF8" stroke-width="1.5" opacity="0.5"/>
    <text x="40" y="10" class="font-sans" font-size="40" font-weight="800" fill="#FFFFFF">+150</text>
    <text x="40" y="34" class="font-sans" font-size="13" font-weight="700" fill="#94A3B8" letter-spacing="1.5">FLEETS MANAGED</text>
  </g>

  <!-- KPI Metric 2: Trips Dispatched (Middle Left) -->
  <g transform="translate(415, 640)">
    <text x="0" y="0" class="font-sans" font-size="28" font-weight="800" fill="#FFFFFF">+10k</text>
    <text x="0" y="20" class="font-sans" font-size="12" font-weight="700" fill="#94A3B8" letter-spacing="1.2">TRIPS DISPATCHED</text>
  </g>

  <!-- KPI Metric 3: On-Time Delivery (Middle Right) -->
  <g transform="translate(1020, 640)">
    <line x1="-25" y1="-10" x2="-10" y2="-28" stroke="#94A3B8" stroke-width="1.5" opacity="0.4"/>
    <text x="0" y="0" class="font-sans" font-size="34" font-weight="800" fill="#FFFFFF">99.8%</text>
    <text x="0" y="22" class="font-sans" font-size="12" font-weight="700" fill="#94A3B8" letter-spacing="1.5">ON-TIME DELIVERY</text>
  </g>

  <!-- Bottom Interactive Buttons -->
  <g transform="translate(675, 770)">
    <!-- 'see it in action' Button -->
    <rect x="0" y="0" width="160" height="52" rx="26" fill="rgba(24, 34, 48, 0.85)" stroke="rgba(255, 255, 255, 0.18)" stroke-width="1"/>
    <text x="32" y="32" class="font-sans" font-size="15" font-weight="600" fill="#F1F5F9">see it in action</text>

    <!-- 'try demo' Button with Vibrant Glow -->
    <g filter="url(#orangeGlow)">
      <rect x="175" y="0" width="135" height="52" rx="26" fill="url(#orangeButton)"/>
      <text x="214" y="32" class="font-sans" font-size="15" font-weight="700" fill="#FFFFFF">try demo</text>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1203 753" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="errorBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A10"/>
      <stop offset="50%" stop-color="#0D1322"/>
      <stop offset="100%" stop-color="#121828"/>
    </linearGradient>

    <!-- Caution Hazard Stripes Pattern -->
    <pattern id="hazardStripes" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="20" height="40" fill="#F59E0B" fill-opacity="0.15"/>
      <rect x="20" width="20" height="40" fill="#000000" fill-opacity="0.3"/>
    </pattern>

    <!-- Amber Glow Filter -->
    <filter id="amberGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    .font-sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'Source Code Pro', monospace; }
  </style>

  <!-- Deep Canvas Background -->
  <rect width="1203" height="753" fill="url(#errorBg)"/>

  <!-- Top Caution Hazard Warning Stripe -->
  <rect x="0" y="0" width="1203" height="12" fill="url(#hazardStripes)"/>
  <rect x="0" y="12" width="1203" height="1" fill="#F59E0B" opacity="0.4"/>

  <!-- Bottom Caution Hazard Warning Stripe -->
  <rect x="0" y="741" width="1203" height="12" fill="url(#hazardStripes)"/>
  <rect x="0" y="740" width="1203" height="1" fill="#F59E0B" opacity="0.4"/>

  <!-- Subtle Circuit / Tech Grid -->
  <g opacity="0.04" stroke="#F59E0B" stroke-width="1">
    <line x1="0" y1="120" x2="1203" y2="120"/>
    <line x1="0" y1="240" x2="1203" y2="240"/>
    <line x1="0" y1="360" x2="1203" y2="360"/>
    <line x1="0" y1="480" x2="1203" y2="480"/>
    <line x1="0" y1="600" x2="1203" y2="600"/>
    <line x1="180" y1="0" x2="180" y2="753"/>
    <line x1="380" y1="0" x2="380" y2="753"/>
    <line x1="600" y1="0" x2="600" y2="753"/>
    <line x1="820" y1="0" x2="820" y2="753"/>
    <line x1="1020" y1="0" x2="1020" y2="753"/>
  </g>

  <!-- Top Status Banner -->
  <g transform="translate(60, 32)">
    <rect x="0" y="0" width="1083" height="54" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.2" filter="url(#cardShadow)"/>
    
    <!-- Left: Error Tag -->
    <g transform="translate(20, 14)">
      <circle cx="12" cy="13" r="6" fill="#F59E0B" filter="url(#amberGlow)"/>
      <text x="28" y="17" class="font-mono" font-size="12" font-weight="700" fill="#FBBF24">STATUS: 503 ERROR // WORK IN PROGRESS</text>
    </g>

    <!-- Center: App Name -->
    <text x="541" y="32" class="font-sans" font-size="14" font-weight="700" fill="#94A3B8" text-anchor="middle">DocuMind AI • Autonomous Documentation Pipeline</text>

    <!-- Right: Git Branch -->
    <g transform="translate(900, 14)">
      <rect x="0" y="0" width="160" height="26" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1"/>
      <text x="80" y="17" class="font-mono" font-size="11" font-weight="600" fill="#38BDF8" text-anchor="middle">branch: dev-working</text>
    </g>
  </g>

  <!-- Central Working Phase Error Billboard -->
  <g transform="translate(60, 106)">
    <!-- Warning Hero Card -->
    <rect x="0" y="0" width="1083" height="220" rx="16" fill="#0B1322" stroke="#F59E0B" stroke-width="1.5" stroke-opacity="0.4" filter="url(#cardShadow)"/>
    
    <!-- Caution Stripes Accent on Top Edge -->
    <path d="M 0 16 Q 0 0 16 0 L 1067 0 Q 1083 0 1083 16 L 1083 24 L 0 24 Z" fill="url(#hazardStripes)"/>

    <!-- Warning Icon & Triangle -->
    <g transform="translate(48, 64)">
      <!-- Outer Pulsing Glow -->
      <polygon points="50,10 95,90 5,90" fill="rgba(245, 158, 11, 0.12)" stroke="#F59E0B" stroke-width="3" filter="url(#amberGlow)"/>
      <!-- Inner Exclamation Mark -->
      <line x1="50" y1="36" x2="50" y2="64" stroke="#FBBF24" stroke-width="5" stroke-linecap="round"/>
      <circle cx="50" cy="77" r="3.5" fill="#FBBF24"/>
    </g>

    <!-- Headings & Explanations -->
    <g transform="translate(175, 62)">
      <rect x="0" y="0" width="220" height="22" rx="4" fill="rgba(245, 158, 11, 0.15)"/>
      <text x="8" y="15" class="font-mono" font-size="10" font-weight="700" fill="#FBBF24" letter-spacing="1">🚧 FEATURE IN WORKING PHASE</text>
      
      <text x="0" y="52" class="font-sans" font-size="28" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">Under Active Development &amp; Training</text>
      
      <text x="0" y="80" class="font-sans" font-size="14" fill="#94A3B8">
        The DocuMind autonomous generation pipeline is currently undergoing CrewAI agent orchestration upgrades,
      </text>
      <text x="0" y="100" class="font-sans" font-size="14" fill="#94A3B8">
        Google Gemini multi-modal schema validation, and PDF compilation benchmark testing.
      </text>
      
      <text x="0" y="126" class="font-mono" font-size="12" font-weight="600" fill="#38BDF8">
        ➔ Live interactive preview disabled during active engineering phase. Source code available on GitHub.
      </text>
    </g>
  </g>

  <!-- Interactive Terminal Simulation -->
  <g transform="translate(60, 346)">
    <rect x="0" y="0" width="1083" height="340" rx="14" fill="#0A0E17" stroke="#1E293B" stroke-width="1.2" filter="url(#cardShadow)"/>
    
    <!-- Terminal Title Bar -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="1083" height="38" rx="14" fill="#141E33" stroke="#1E293B" stroke-width="1"/>
      <!-- Window Controls -->
      <circle cx="22" cy="19" r="5" fill="#EF4444"/>
      <circle cx="38" cy="19" r="5" fill="#F59E0B"/>
      <circle cx="54" cy="19" r="5" fill="#10B981"/>
      
      <!-- Terminal Title -->
      <text x="541" y="23" class="font-mono" font-size="11" font-weight="600" fill="#94A3B8" text-anchor="middle">terminal ~ documind-agent-pipeline --dev-status</text>
      
      <text x="1055" y="23" class="font-mono" font-size="10" font-weight="700" fill="#F59E0B" text-anchor="end">● COMPILING</text>
    </g>

    <!-- Terminal Code Output Lines -->
    <g transform="translate(28, 62)">
      <text x="0" y="16" class="font-mono" font-size="12" fill="#64748B">[09:14:20] <tspan fill="#38BDF8">SYSTEM:</tspan> Bootstrapping DocuMind Python execution sandbox...</text>
      <text x="0" y="42" class="font-mono" font-size="12" fill="#64748B">[09:14:21] <tspan fill="#34D399">SUCCESS:</tspan> AST Parser loaded for Python 3.12, Jupyter &amp; TypeScript modules.</text>
      <text x="0" y="68" class="font-mono" font-size="12" fill="#64748B">[09:14:23] <tspan fill="#A78BFA">AGENT-1:</tspan> CrewAI CodeReviewer initialized (orchestrating Gemini 1.5 Pro)...</text>
      <text x="0" y="94" class="font-mono" font-size="12" fill="#64748B">[09:14:25] <tspan fill="#A78BFA">AGENT-2:</tspan> TechWriterAgent generating publication-grade documentation schemas...</text>
      
      <!-- Highlighted Working Phase Notice -->
      <g transform="translate(0, 114)">
        <rect x="-10" y="-14" width="1047" height="48" rx="6" fill="rgba(245, 158, 11, 0.1)" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1"/>
        <text x="0" y="8" class="font-mono" font-size="12" font-weight="700" fill="#FBBF24">
          [09:14:26] ⚠️ [WORKING_PHASE_ACTIVE]: Multi-Agent Report Compilation Milestone in progress (84% complete)
        </text>
        <text x="0" y="26" class="font-mono" font-size="11" fill="#CBD5E1">
          &gt;&gt; Live demo endpoints paused pending multi-turn agent hallucination checks &amp; PDF styling engine lock.
        </text>
      </g>

      <text x="0" y="184" class="font-mono" font-size="12" fill="#64748B">[09:14:28] <tspan fill="#F87171">HTTP 503:</tspan> ServiceUnavailableException: Service locked during scheduled development sprint.</text>
      <text x="0" y="210" class="font-mono" font-size="12" fill="#64748B">[09:14:30] <tspan fill="#38BDF8">REPOSITORY:</tspan> git clone https://github.com/OmChauhan07/DocuMind.git (active commits)</text>

      <!-- Terminal Cursor Prompt -->
      <g transform="translate(0, 240)">
        <text x="0" y="16" class="font-mono" font-size="13" font-weight="700" fill="#34D399">documind@dev-node:~$</text>
        <text x="180" y="16" class="font-mono" font-size="13" fill="#FFFFFF">pytest tests/test_agents.py --verbose</text>
        <rect x="475" y="4" width="8" height="15" fill="#34D399">
          <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>
  </g>
</svg>

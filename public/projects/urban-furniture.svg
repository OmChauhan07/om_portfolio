      <text x="148" y="84" class="font-mono" font-size="13" fill="#E7E5E4">4010 - Sales Revenue</text>
      <text x="388" y="84" class="font-sans" font-size="14" fill="#D6D3D1">Custom Furnishing Contract: Meridian Towers</text>
      <text x="788" y="84" class="font-mono" font-size="14" fill="#78716C">—</text>
      <text x="1018" y="84" class="font-mono" font-size="14" font-weight="700" fill="#F59E0B">$34,500.00</text>
      <text x="1248" y="84" class="font-mono" font-size="12" font-weight="700" fill="#10B981">POSTED</text>

      <line x1="0" y1="104" x2="1376" y2="104" stroke="#2B231A"/>
      <text x="24" y="136" class="font-mono" font-size="13" fill="#D97706">#TXN-8494</text>
      <text x="148" y="136" class="font-mono" font-size="13" fill="#E7E5E4">5010 - Hardwood Raw Materials</text>
      <text x="388" y="136" class="font-sans" font-size="14" fill="#D6D3D1">Lumber Supply Invoice: Quarter-Sawn White Oak</text>
      <text x="788" y="136" class="font-mono" font-size="14" font-weight="700" fill="#10B981">$12,840.00</text>

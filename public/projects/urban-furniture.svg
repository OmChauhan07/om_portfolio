      <text x="24" y="188" class="font-mono" font-size="13" fill="#D97706">#TXN-8495</text>
      <text x="148" y="188" class="font-mono" font-size="13" fill="#E7E5E4">2010 - Accounts Payable</text>
      <text x="388" y="188" class="font-sans" font-size="14" fill="#D6D3D1">Vendor Bill: Cascade Timber Co.</text>
